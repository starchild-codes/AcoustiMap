services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    volumes:
      - storage_data:/app/storage
    environment:
      - ACOUSTIMAP_DATABASE_URL=sqlite+aiosqlite:///./storage/acoustimap.db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - storage_data:/app/storage
    environment:
      - ACOUSTIMAP_DATABASE_URL=sqlite+aiosqlite:///./storage/acoustimap.db
      - ACOUSTIMAP_CORS_ORIGINS=["http://localhost:5173","http://localhost:4173"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.analysis_worker"]
    volumes:
      - storage_data:/app/storage
    environment:
      - ACOUSTIMAP_DATABASE_URL=sqlite+aiosqlite:///./storage/acoustimap.db
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  storage_data:
