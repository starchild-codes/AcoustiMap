services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - storage_data:/app/storage
    environment:
      - ACOUSTIMAP_DATABASE_URL=sqlite+aiosqlite:///./storage/acoustimap.db
      - ACOUSTIMAP_CORS_ORIGINS=["http://localhost:5173","http://localhost:4173"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.analysis_worker"]
    volumes:
      - storage_data:/app/storage
    environment:
      - ACOUSTIMAP_DATABASE_URL=sqlite+aiosqlite:///./storage/acoustimap.db
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  storage_data:
